name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start local Supabase
        run: pnpm db:local:start

      - name: Reset and seed local database
        run: pnpm db:local:reset

      - name: Configure test environment
        shell: bash
        run: |
          STATUS="$(pnpm exec supabase status -o env)"
          API_URL="$(printf '%s\n' "$STATUS" | sed -n 's/^API_URL="\(.*\)"/\1/p')"
          ANON_KEY="$(printf '%s\n' "$STATUS" | sed -n 's/^ANON_KEY="\(.*\)"/\1/p')"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          {
            echo "TEST_SUPABASE_URL=$API_URL"
            echo "TEST_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "TEST_BASE_URL=http://127.0.0.1:3100"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: RLS tests
        run: pnpm test:rls

      - name: Browser tests
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm db:local:stop
